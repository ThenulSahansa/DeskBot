name: Build and Release ESP32 Firmware (Arduino IDE)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform Core Packages
        run: |
          arduino-cli core update-index
          arduino-cli core update-index --additional-urls https://github.io
          arduino-cli core install esp32:esp32 --additional-urls https://github.io

      - name: Compile Arduino Sketch
        run: |
          mkdir -p ./build
          # This runs the compiler cleanly targeting your exact Main path layout directly
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build ./firmware

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
