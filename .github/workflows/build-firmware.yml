
name: Build and Release ESP32 Firmware (Arduino IDE)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Platform Core Packages
        env:
          ESP32_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
        run: |
          arduino-cli core update-index
          arduino-cli core update-index --additional-urls "$ESP32_URL"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_URL"

      - name: Install ArduinoJson
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoJson"

      - name: Compile Arduino Sketch
        run: |
          mkdir -p ./build
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:PartitionScheme=min_spiffs \
            --output-dir ./build \
            ./firmware

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./build/*.bin
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
